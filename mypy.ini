[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True

# Phase 1: Allow untyped code in most modules
# Phase 2: Enable per-module strict checking as annotations are added
# Target: ~130 sites need annotation (generic dict, Redis params, pydantic Url, celery stubs)

[mypy-celery.*]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-slowapi.*]
ignore_missing_imports = True

[mypy-rapidfuzz.*]
ignore_missing_imports = True

[mypy-locust.*]
ignore_missing_imports = True
